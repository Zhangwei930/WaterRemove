name: Release (简体中文版)

# 简体中文版を GitHub Actions の Windows ランナーでビルドし、このリポジトリの
# Releases に公開する。成果物は 2 種類:
#   - mImageViewer_zh-CN_portable_<tag>.zip  ポータブル版 (loose DLL / モデル同梱)
#   - mImageViewer_zh-CN_<tag>.exe           単体 exe 版 (launcher に全部埋め込み)
# インストーラ (setup.exe) は作らない。
#
# 使い方: `v<本体バージョン>-zh.<DISTRIBUTION_REVISION>` 形式のタグを push する
# (例: v4.0.0-zh.1)。既存タグで作り直す場合は Actions 画面から workflow_dispatch で
# タグ名を指定して再実行する (既存 Release の添付は上書きされる)。
#
# ビルド方針:
# - Rust のコード (core / remote / launcher) と VST3 host bridge (C++) はこの
#   リポジトリのソースからビルドする。
# - AI モデル・PDFium・ONNX Runtime・Susie 32bit ワーカー・FFmpeg DLL・VC ランタイムは
#   上流 (MikageSawatari/mimageviewer) の同じ本体バージョンのポータブル版 zip に
#   同梱されている実物をそのまま使う。モデルは APPDATA からのコピー以外に取得経路が
#   無く、上流の配布物と同一のものを使うのが最も確実なため。
# - FFmpeg の import library / ヘッダは BtbN の n7.1 系 LGPL shared build から取る
#   (上流 v4.0.0 の n7.1.5-16 は BtbN から消えているため、残っている最新の n7.1 を使う。
#   DLL 名・ABI は 7.1 系で共通)。同梱する DLL は上流と同一なので、アプリ内の
#   FFmpeg ビルド識別子 (vendor/ffmpeg/VERSION) も上流 DLL の値に合わせる。
#   準備手順は .github/actions/prepare-build にまとめてある。
# - コード署名は行わない (上流の証明書は使えない)。

on:
  push:
    tags: ['v*-zh.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.0.0-zh.1). The tag must already exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-zh-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: MikageSawatari/mimageviewer
  # 上流ポータブル版から実行時ファイルを取る本体バージョン。Cargo.toml と一致させる。
  UPSTREAM_TAG: v4.0.0
  # 上流ポータブル版に同梱されている FFmpeg DLL のビルド識別子 (DLL の ProductVersion)。
  UPSTREAM_FFMPEG_BUILD_ID: n7.1.5-16-g9a4bb2c579
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false
      - name: Check tag matches Cargo.toml and DISTRIBUTION_REVISION
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version = "([^"]+)"') { throw 'version not found in Cargo.toml' }
          $version = $Matches[1]
          $update = Get-Content src/update_check.rs -Raw
          if ($update -notmatch 'DISTRIBUTION_REVISION: u64 = (\d+)') { throw 'DISTRIBUTION_REVISION not found' }
          $revision = $Matches[1]
          $expected = "v$version-zh.$revision"
          if ($tag -ne $expected) {
            throw "Tag $tag does not match the source ($expected). Update Cargo.toml / DISTRIBUTION_REVISION or the tag."
          }
          if ("v$version" -ne $env:UPSTREAM_TAG) {
            throw "Cargo.toml version v$version differs from UPSTREAM_TAG $env:UPSTREAM_TAG. Update UPSTREAM_TAG / UPSTREAM_FFMPEG_BUILD_ID in this workflow."
          }
          Write-Host "Building $tag (upstream runtime files: $env:UPSTREAM_TAG)"

  portable:
    name: Portable zip (windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false

      - uses: ./.github/actions/prepare-build
        with:
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          upstream-tag: ${{ env.UPSTREAM_TAG }}
          upstream-ffmpeg-build-id: ${{ env.UPSTREAM_FFMPEG_BUILD_ID }}
          github-token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-zh-portable
          workspaces: '. -> target-portable'

      - name: Build core (portable)
        run: cargo build --release --locked --bin mimageviewer-core --features portable --target-dir target-portable

      - name: Build remote service
        run: cargo build --release --locked -p mimageviewer-remote --bin mimageviewer-remote --features embedded-web-assets --target-dir target-portable

      - name: Test i18n / settings / update check
        run: |
          cargo test --release --locked --lib --features portable --target-dir target-portable -- i18n:: update_check:: ui_language

      - name: Assemble portable zip
        run: |
          $name = "mImageViewer_zh-CN_portable_$env:RELEASE_TAG"
          $out = "dist\$name"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item upstream\pkg $out -Recurse
          Copy-Item target-portable\release\mimageviewer-core.exe "$out\mimageviewer.exe" -Force
          Copy-Item target-portable\release\mimageviewer-remote.exe "$out\mimageviewer-remote.exe" -Force
          Copy-Item LICENSE "$out\LICENSE-mimageviewer.txt" -Force
          Copy-Item .github\release-zh\readme_zh.txt "$out\readme_zh.txt" -Force
          # zip の中身を一覧で残しておく (添付ファイルの取り違え確認用)。
          Get-ChildItem -Recurse $out -File | ForEach-Object {
            '{0,12}  {1}  {2}' -f $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.FullName.Substring((Resolve-Path $out).Path.Length + 1)
          }
          Compress-Archive -Path "$out\*" -DestinationPath "dist\$name.zip" -CompressionLevel Optimal
          (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash + "  $name.zip" | Set-Content -Encoding ascii "dist\$name.zip.sha256"
          Remove-Item -Recurse -Force $out

      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  exe:
    name: Single exe (windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false

      - uses: ./.github/actions/prepare-build
        with:
          upstream-repo: ${{ env.UPSTREAM_REPO }}
          upstream-tag: ${{ env.UPSTREAM_TAG }}
          upstream-ffmpeg-build-id: ${{ env.UPSTREAM_FFMPEG_BUILD_ID }}
          github-token: ${{ github.token }}

      - name: Fetch VST3 SDK (MIT)
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vendor/vst3sdk
          if ($LASTEXITCODE -ne 0) { throw "VST3 SDK clone failed ($LASTEXITCODE)" }
          if (-not (Select-String -Path vendor/vst3sdk/LICENSE.txt -Pattern 'MIT License' -Quiet)) { throw 'VST3 SDK is not MIT licensed' }
          git -C vendor/vst3sdk log -1 --format='VST3 SDK %H %cd'

      - name: Build VST3 host bridge (C++)
        run: |
          # 既定の Visual Studio generator を使う (出力先は CMakeLists.txt が vendor/vst3-host に固定)。
          cmake -S crates/vst3-host -B crates/vst3-host/build -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }
          cmake --build crates/vst3-host/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed ($LASTEXITCODE)" }
          if (-not (Test-Path vendor/vst3-host/mimageviewer-vst3-host.exe)) { throw 'mimageviewer-vst3-host.exe was not produced' }
          Get-Item vendor/vst3-host/mimageviewer-vst3-host.exe | Select-Object FullName, Length

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-zh-exe

      - name: Build core (embedded assets)
        run: cargo build --release --locked --bin mimageviewer-core

      - name: Build remote service
        run: cargo build --release --locked -p mimageviewer-remote --bin mimageviewer-remote --features embedded-web-assets

      - name: Build launcher (single exe)
        run: cargo build --release --locked -p mimageviewer-launcher --bin mimageviewer

      - name: Collect exe
        run: |
          $name = "mImageViewer_zh-CN_$env:RELEASE_TAG.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\mimageviewer.exe "dist\$name"
          (Get-FileHash "dist\$name" -Algorithm SHA256).Hash + "  $name" | Set-Content -Encoding ascii "dist\$name.sha256"
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize
          # launcher は GUI サブシステムなので、終了を待って exit code を確かめる。
          $proc = Start-Process -FilePath "dist\$name" -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "exe --version failed ($($proc.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [portable, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          sed -e "s/{TAG}/${RELEASE_TAG}/g" -e "s/{UPSTREAM_TAG}/${UPSTREAM_TAG}/g" .github/release-zh/notes.md > release-notes.md
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --title "mImageViewer 简体中文版 $RELEASE_TAG" --notes-file release-notes.md
          fi
